<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Tabs - Enhanced</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Save Tabs</h1>
            <p>Organize your links with folders</p>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" id="input-el" placeholder="Enter URL or paste link">
            </div>

            <div class="button-group">
                <button id="input-btn" class="btn-primary" title="Add the URL">
                    <i class="fas fa-plus"></i>
                    Add Link
                </button>
                <button id="tab-btn" class="btn-secondary" title="Save current tab (Chrome extension only)">
                    <i class="fas fa-window-restore"></i>
                    Save Tab
                </button>
                <button id="delete-btn" class="btn-danger" title="Delete all folders and links">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>

        <div class="folder-section">
            <div class="folder-header">
                <div class="folder-title">Folders</div>
                <button class="add-folder-btn" id="add-folder-btn" title="Create a new folder">
                    <i class="fas fa-plus"></i> Add Folder
                </button>
            </div>

            <div id="folders-container"></div>
        </div>

        <div class="uncategorized" id="uncategorized-section">
            <h3>
                <i class="fas fa-inbox"></i>
                Uncategorized Links
            </h3>
            <div id="uncategorized-links"></div>
        </div>

        <div class="empty-state" id="empty-state">
            <i class="fas fa-bookmark"></i>
            <p>No links saved yet.<br>Start by adding a link or saving the current tab.</p>
        </div>
    </div>
    <script src="./index.js"></script>
</body>

</html>
